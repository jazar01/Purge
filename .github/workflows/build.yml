name: build

# Every push and pull request is built and tested.
# Pushing a version tag such as v2.4.0 also publishes a GitHub Release with the exe.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create a release when a tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet publish Purge -c Release -r win-x64 -p:PublishSingleFile=true --self-contained true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Purge-win-x64
          path: publish/Purge.exe

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: ./.github/scripts/release.ps1 -Tag $env:TAG
