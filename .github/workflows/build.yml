name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: dotnet publish Purge -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Purge-win-x64
          path: publish/Purge.exe
